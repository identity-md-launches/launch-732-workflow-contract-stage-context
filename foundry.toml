[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["forge-std/=lib/forge-std-1.9.7/src/"]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false
